<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <link rel="stylesheet" href="../../styles/styles.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1 class="logo">Tiendita</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="./index.html">Inicio</a></li>
                <!-- El contenido de este LI se generará dinámicamente (Perfil o Iniciar Sesión) -->
                
                <li>
                    <a href="../Cart/carrito.html" class="carrito-link">
                        <span class="icono-carrito">🛒</span>
                        <span>Carrito</span>
                    </a>
                </li>
                <li id="auth-link-container"></li>
            </ul>
        </nav>
    </header>

    <!-- BANNER -->
    <section class="banner">
        <h2>Bienvenido a nuestra tienda</h2>
        <p>Encuentra los mejores productos aquí</p>
    </section>

    <!-- PRODUCTOS -->
    <section class="productos">
        <h2>Productos</h2>

        <div class="grid-productos">
            <p style="text-align: center; width: 100%;">Cargando productos...</p>
        </div>
    </section>

    

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Tiendita - La mejor página web para Mercar</p>
    </footer>
<script type="module" src="../../index.js"></script>
</body>
</html>
