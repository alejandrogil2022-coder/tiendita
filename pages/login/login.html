<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Tiendita</title>
    <link rel="stylesheet" href="../../styles/styles.css">
</head>
<body>

<header class="header">
    <h1 class="logo">Tiendita</h1>
    <nav>
        <ul class="nav-links">
            <li><a href="../Home/index.html">Inicio</a></li>
            <!-- El contenido de este LI se generará dinámicamente (Perfil o Iniciar Sesión) -->
            <li id="auth-link-container"></li>
            <li>
                 <a href="../Cart/carrito.html" class="carrito-link">
                     <span class="icono-carrito">🛒</span>
                     <span>Carrito</span>
                 </a>
            </li>
        </ul>
    </nav>
</header>

<section class="login-container">
    <div class="login-box">
        <h2>Iniciar sesión</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
        <!-- Enlace para abrir la ventana de registro -->
        <a href="#" id="btn-abrir-registro" class="enlace-registro">¿No tienes cuenta? Regístrate aquí</a>
    </div>
</section>

<footer class="footer">
    <p>© 2026 Tiendita - La mejor página web para Mercar</p>
</footer>

<!-- Modal de Registro -->
<div id="modal-registro" class="modal-overlay">
    <div class="modal-content">
        <button id="btn-cerrar-registro" class="close-modal">&times;</button>
        <h2>Crear Cuenta</h2>
        <form id="register-form">
            <div class="input-group">
                <label for="reg-nombre">Nombre completo</label>
                <input type="text" id="reg-nombre" required>
            </div>
            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required>
            </div>
            <button type="submit" class="btn-login">Registrarse</button>
        </form>
    </div>
</div>

<script type="module" src="../../index.js"></script>
</body>
</html>
